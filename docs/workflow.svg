<svg viewBox="0 0 680 300" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>试卷发布 Skill 的前馈—执行—终检主线</title>
<desc>主线：前馈确认 Q0-Q10、执行（三个不可逆点必问）、发布前终检后发布、答题纸最后微调自动暂停交用户。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.tt{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;fill:#26215C}
.st{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:400;fill:#534AB7}
.bt{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;fill:#04342C}
.mt{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;fill:#412402}
.cap{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:400;fill:#5F5E5A}
</style>
</defs>

<text x="40" y="30" class="tt">试卷发布 · 主线</text>

<g>
<rect x="40" y="50" width="180" height="66" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="130" y="76" class="tt" text-anchor="middle" dominant-baseline="central">1 · 前馈确认</text>
<text x="130" y="99" class="st" text-anchor="middle" dominant-baseline="central">Q0–Q10 一次性问清</text>
</g>
<path d="M224 83 L248 83" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="250" y="50" width="180" height="66" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="76" class="bt" text-anchor="middle" dominant-baseline="central">2 · 执行</text>
<text x="340" y="99" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">三个不可逆点必问</text>
</g>
<path d="M434 83 L458 83" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="460" y="50" width="180" height="66" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="550" y="76" class="mt" text-anchor="middle" dominant-baseline="central">3 · 发布前终检</text>
<text x="550" y="99" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">逐条核对再发布</text>
</g>

<text x="40" y="140" class="cap">发布后 → 答题纸：核对默认字段 → 自动暂停，最后布局微调由用户手动完成</text>

<text x="40" y="168" class="tt">最高优先级前馈：多选题判分规则</text>
<g>
<rect x="40" y="178" width="600" height="52" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="56" y="204" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#501313" dominant-baseline="central">强制对齐三问</text>
<text x="170" y="204" class="cap" dominant-baseline="central">题目怎么设计 → 系统设哪种 → 纸卷说明改不改；系统与纸卷一致才可导入</text>
</g>

<text x="40" y="262" class="tt">硬约定</text>
<text x="40" y="284" class="cap">学生可见文案不写 A/B 卷 · 多选规则须与纸卷说明一致 · 课程/批次/场次选填可留空 · 导入/发布/发通知必问用户 · “0 人”是假象以 classids 为准 · 退回第一步须知须补写</text>
</svg>
